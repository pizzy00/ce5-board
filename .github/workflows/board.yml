name: board
# Every trip the beacon page files arrives as a new issue (title "TRIP · <destination>", body = one JSON object).
# Step 1 turns up to 100 of the oldest open issues into board.json + BOARD.md (only issues filed by the repo owner's
# key count; the light-years come from a fixed table, never from the body). Step 2 commits and pushes (rebase + retry).
# Step 3 closes the issues ONLY after the push succeeded, so a failed run leaves them open for the next run.
on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: build the board from the open issues
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require("fs");
            const OWNER = String(context.repo.owner).toLowerCase();
            const MAX_TRIPS = 500, PER_RUN = 100, PER_NAME_DAY = 20, NAME_MAX = 24;
            const DEST = { "ZETA RETICULI": 39.3, "PLEIADES · TAYGETA": 444, "SIRIUS": 8.6, "ARCTURUS": 36.7, "VEGA · LYRA": 25,
              "ORION · RIGEL": 860, "ANDROMEDA": 2537000, "PROCYON": 11.5, "THUBAN · DRACO": 303, "LUNA · FAR SIDE": 0, "DEEP OCEAN": 0, "BERMUDA TRIANGLE": 0, "EARTH": 0,
              "40 ERIDANI A": 16.3, "ALPHA CENTAURI B": 4.37 };
            const clean = (s, n) => String(s || "").normalize("NFC").toUpperCase().replace(/[^A-Z0-9 .'’\-—·À-ɏ]/g, " ").replace(/\s+/g, " ").trim().slice(0, n);
            const day = (t) => new Date(t).toISOString().slice(0, 10);
            // 1. what we have
            let board = { updated: "", trips: [], leaders: [], totals: {}, visits: { total: 0, days: {} }, ideas: [] }, had = false;
            try { board = JSON.parse(fs.readFileSync("board.json", "utf8")); had = true; } catch (e) {}
            const trips = Array.isArray(board.trips) ? board.trips : [];
            const totals = (board.totals && typeof board.totals === "object") ? board.totals : {};
            const visits = (board.visits && typeof board.visits === "object" && board.visits.days) ? board.visits : { total: 0, days: {} };
            const ideas = Array.isArray(board.ideas) ? board.ideas : [];
            const seen = new Set(trips.map((t) => t.id));
            const perDay = {};
            for (const t of trips) { const k = t.n + "|" + day(t.t); perDay[k] = (perDay[k] || 0) + 1; }
            // 2. the oldest open issues, one page; the next trip or the schedule catches up on the rest
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: PER_RUN, sort: "created", direction: "asc" });
            const closes = []; let added = 0;
            for (const is of issues) {
              if (is.pull_request) continue;
              const fromOwner = is.user && String(is.user.login).toLowerCase() === OWNER;
              const mine = /^TRIP · /.test(is.title || "") && fromOwner;
              const visit = (is.title || "").trim() === "VISIT" && fromOwner;
              const idea = (is.title || "").trim() === "IDEA" && fromOwner;
              let ok = false;
              if (seen.has(is.number)) ok = true;                                   // boarded on an earlier run whose close failed
              else if (visit) {                                                     // one head-count, nothing else in it is trusted
                const d = day(is.created_at);
                if ((visits.days[d] || 0) < 5000) { visits.days[d] = (visits.days[d] || 0) + 1; visits.total++; added++; }
                const keys = Object.keys(visits.days).sort();                       // keep the last 60 days of detail, the total keeps everything
                while (keys.length > 60) delete visits.days[keys.shift()];
                ok = true;
              }
              else if (idea) {                                                    // a wish for the builder, shown to everyone
                try {
                  const j = JSON.parse(String(is.body || "").replace(/^```(json)?\s*|\s*```$/g, ""));
                  const n = clean(j && j.n, NAME_MAX), txt = clean(j && j.txt, 240);
                  if (txt.length >= 3 && !ideas.some((x) => x.id === is.number)) {
                    ideas.push({ id: is.number, n, txt, t: Date.parse(is.created_at), r: [] });
                    while (ideas.length > 100) ideas.shift();
                    added++;
                  }
                  try { await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: is.number, labels: ["idea"] }); } catch (e) {}   // so the builder can find it and answer
                  ok = true;
                } catch (e) {}
              }
              else if (mine) {
                try {
                  const j = JSON.parse(String(is.body || "").replace(/^```(json)?\s*|\s*```$/g, ""));
                  const n = clean(j && j.n, NAME_MAX), d = clean(j && j.d, 40), t = Date.parse(is.created_at);
                  const k = n + "|" + day(t); perDay[k] = (perDay[k] || 0) + 1;
                  if (n.length >= 2 && Object.prototype.hasOwnProperty.call(DEST, d) && perDay[k] <= PER_NAME_DAY && Number.isFinite(t)) {
                    const ly = DEST[d];
                    trips.push({ id: is.number, n, d, ly, t }); seen.add(is.number); added++; ok = true;
                    const r = totals[n] || { trips: 0, ly: 0, far: 0, last: 0 };
                    r.trips++; r.ly = Math.round((r.ly + ly) * 10) / 10; r.far = Math.max(r.far, ly); r.last = Math.max(r.last, t);
                    totals[n] = r;
                  }
                } catch (e) {}
              }
              closes.push({ number: is.number, ok });                              // junk (anyone else's, or malformed) closes as not planned
            }
            // 2b. answers: any comment the OWNER wrote on an idea issue is a public reply.
            //     GitHub authenticates the author, so the page's own key cannot forge one.
            for (const idea of ideas.slice(-40)) {
              try {
                const { data: cs } = await github.rest.issues.listComments({ owner: context.repo.owner,
                  repo: context.repo.repo, issue_number: idea.id, per_page: 20 });
                const was = JSON.stringify(idea.r || []);
                const rs = [];
                for (const c of cs) {
                  if (!c.user || String(c.user.login).toLowerCase() !== OWNER) continue;
                  const txt = clean(String(c.body || "").replace(/\r?\n+/g, " "), 400);
                  if (txt.length < 2) continue;
                  rs.push({ by: "THE BUILDER", txt, t: Date.parse(c.created_at) });
                }
                idea.r = rs.slice(-5);
                if (JSON.stringify(idea.r) !== was) added++;                       // a new answer is worth a commit
              } catch (e) {}
            }
            fs.writeFileSync("closes.json", JSON.stringify(closes));
            core.info("open " + issues.length + ", added " + added + ", to close " + closes.length);
            if (!added && had) return;                                            // nothing new: no file churn, no empty commit
            // 3. the board: latest trips, and the leaders from the running totals (a flood cannot evict them)
            trips.sort((a, b) => a.t - b.t);
            while (trips.length > MAX_TRIPS) trips.shift();
            const leaders = Object.keys(totals).map((n) => ({ n, ...totals[n] }))
              .sort((a, b) => b.ly - a.ly || b.trips - a.trips || b.last - a.last).slice(0, 100);
            fs.writeFileSync("board.json", JSON.stringify({ updated: new Date().toISOString(), trips, leaders, totals, visits, ideas }));
            // 4. the readable one
            const cell = (s) => String(s).replace(/[|\\<>\[\]`*_~]/g, "");
            const fmt = (ly) => ly >= 1e6 ? (ly / 1e6).toFixed(1) + "M LY" : ly >= 1e3 ? (ly / 1e3).toFixed(1) + "K LY" : ly + " LY";
            const when = (t) => new Date(t).toISOString().slice(0, 16).replace("T", " ") + " UTC";
            let md = "# CE-5 BEACON — TRAVELLERS BOARD\n\nWho went where, from https://pizzy00.github.io/ce5-beacon/ · updated " + when(Date.now()) + "\n\n";
            md += "## LEADERS — LIGHT-YEARS ALL TOLD\n\n| # | CALL-SIGN | TRIPS | LIGHT-YEARS | FARTHEST | LAST SEEN |\n|---|---|---|---|---|---|\n";
            leaders.slice(0, 50).forEach((r, i) => { md += "| " + (i + 1) + " | " + cell(r.n) + " | " + r.trips + " | " + fmt(r.ly) + " | " + fmt(r.far) + " | " + when(r.last) + " |\n"; });
            md += "\n**SEEN BY " + visits.total + " DEVICE-DAYS ALL TOLD** (one count per device per day)\n";
            md += "\n## THE LAST 100 TRIPS\n\n| WHEN | CALL-SIGN | WENT TO | LIGHT-YEARS |\n|---|---|---|---|\n";
            trips.slice(-100).reverse().forEach((t) => { md += "| " + when(t.t) + " | " + cell(t.n) + " | " + cell(t.d) + " | " + fmt(t.ly) + " |\n"; });
            if (ideas.length) {
              md += "\n## IDEAS FROM TRAVELLERS\n\n";
              ideas.slice(-50).reverse().forEach((x) => {
                md += "- **" + cell(x.n || "SOMEONE") + "**: " + cell(x.txt) + "\n";
                for (const r of (Array.isArray(x.r) ? x.r : [])) md += "  - _" + cell(r.by) + "_: " + cell(r.txt) + "\n";
              });
            }
            fs.writeFileSync("BOARD.md", md);
      - name: commit and push
        run: |
          git config user.name "ce5-board"
          git config user.email "ce5-board@users.noreply.github.com"
          git add board.json BOARD.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "board: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: close the issues that are on the board (or junk), now that the push is in
        if: success()
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const fs = require("fs");
            let closes = []; try { closes = JSON.parse(fs.readFileSync("closes.json", "utf8")); } catch (e) {}
            for (const c of closes) {
              try {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: c.number,
                  state: "closed", state_reason: c.ok ? "completed" : "not_planned" });
              } catch (e) { core.warning("close #" + c.number + ": " + e.message); }
              await new Promise((r) => setTimeout(r, 250));
            }
